<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你的名字 · 作品集</title>
  <meta name="description" content="個人作品集：專案、技能與聯絡方式" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="logo" id="nav-name">你的名字</a>
      <nav class="nav-links">
        <a href="#projects">作品</a>
        <a href="#about">關於我</a>
        <a href="#contact">聯絡</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- 個人介紹 -->
    <section class="hero container">
      <p class="eyebrow" id="hero-role">前端工程師 / 設計師</p>
      <h1 id="hero-name">你好，我是 你的名字</h1>
      <p class="hero-intro" id="hero-intro">一段簡短的自我介紹。</p>
      <div class="hero-actions" id="hero-actions"></div>
    </section>

    <!-- 作品 -->
    <section id="projects" class="section container">
      <div class="section-head">
        <h2>作品集</h2>
        <div class="filters" id="filters" role="tablist" aria-label="篩選作品"></div>
      </div>
      <div class="grid" id="project-grid"></div>
    </section>

    <!-- 關於我 -->
    <section id="about" class="section container about">
      <h2>關於我</h2>
      <div class="about-grid">
        <p id="about-text"></p>
        <div>
          <h3>技能</h3>
          <ul class="skills" id="skills"></ul>
        </div>
      </div>
    </section>
  </main>

  <!-- 聯絡 -->
  <footer id="contact" class="footer">
    <div class="container">
      <h2>一起合作吧</h2>
      <p>歡迎透過以下方式聯絡我。</p>
      <div class="contact-links" id="contact-links"></div>
      <p class="copyright" id="copyright"></p>
    </div>
  </footer>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
